# Junto API on Fly.io.
#
# Rename `app` before the first deploy; everything else is deliberate. See docs/deploy.md for
# the secrets checklist and the runbook.

app = "junto-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

# Migrations run once per deploy, before any new machine takes traffic. The binary is the one
# in the image being deployed, so the schema can never be applied by a different build than
# the one about to serve it — which is the failure a separately-run migration step invites.
#
# A failing release_command aborts the deploy and the OLD machines keep serving. That is the
# right default here: the migrations are additive by convention, so the previous build is
# always compatible with the schema it is already running against.
[deploy]
  release_command = "/migrate up"
  strategy = "rolling"

[env]
  JUNTO_ENV = "production"
  HTTP_ADDR = ":8080"

  # Fly terminates TLS at the edge and forwards over the private network, so the API is
  # genuinely behind a trusted proxy and X-Forwarded-For can be believed. cmd/api already
  # enables RealIP in production for this reason (RouterConfig.TrustProxyHeaders); without a
  # proxy in front, that header is client-controlled and would let anyone spoof their address
  # past the per-IP rate limiter.
  HTTP_DRAIN_DELAY = "8s"
  HTTP_SHUTDOWN_TIMEOUT = "20s"

[http_service]
  internal_port = 8080
  force_https = true

  # Never scale to zero. A cold start would have to reconnect Postgres and Redis and re-open
  # every WebSocket, and the sync engine's whole value proposition is a socket that stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # kill_timeout MUST exceed HTTP_DRAIN_DELAY + HTTP_SHUTDOWN_TIMEOUT, or Fly SIGKILLs the
  # process partway through the drain it was asked to perform — and the drain becomes strictly
  # worse than having none, because connections are cut at an arbitrary point instead of at a
  # chosen one. 8 + 20 = 28, so 40 leaves real margin.
  kill_signal = "SIGTERM"
  kill_timeout = "40s"

  # Readiness gates traffic. A 2s interval is what makes the 8s drain delay sufficient: the
  # instance fails four consecutive checks and leaves the pool well before the listener closes.
  # Lengthening this interval without lengthening HTTP_DRAIN_DELAY reopens the 502 window.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "2s"
    method = "GET"
    path = "/readyz"
    timeout = "2s"

  # Liveness restarts a wedged machine. Deliberately slower and more forgiving than readiness,
  # because the consequences are asymmetric: a false readiness failure removes one instance
  # from a pool, a false liveness failure destroys it. /livez consults no dependency, so the
  # only thing that can fail this is the process itself being unable to answer.
  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/livez"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
