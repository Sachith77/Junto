# Junto frontend on Netlify.
#
# This exists because dashboard-only configuration is exactly what broke the first deploy:
# nothing in the repo told Netlify that the Next.js project lives in web/, not at the repo
# root (the root also holds the unrelated Go backend), so the Next.js Runtime never located
# next.config.ts, never activated, and Netlify fell back to serving nothing — its own generic
# "Page not found" for every path, confirmed against the live site's actual response headers
# (Server: Netlify, Netlify's own branded 404 template) rather than assumed.

[build]
  base = "web"
  command = "npm run build"

  # `publish` IS set by hand here, reversing the earlier version of this file — worth being
  # explicit about why rather than silently flipping position. The general Netlify guidance
  # ("the Runtime sets publish automatically, don't set it yourself") describes the simple,
  # single-project, auto-detected case. For a MONOREPO with the plugin declared explicitly —
  # this repo, where web/ sits alongside an unrelated Go backend — Netlify's own plugin docs
  # describe a different, equally official pattern: point `publish` at the `.next` directory
  # (or a custom `distDir`) yourself. Both pieces of guidance are real; they apply to different
  # setups, and this is the monorepo one.
  #
  # The value is `.next`, NOT `web/.next`. Confirmed against Netlify's own docs before writing
  # this, because it is exactly the kind of thing worth getting wrong quietly: paths in
  # netlify.toml resolve RELATIVE TO `base` once `base` is set (Netlify's own example: with
  # base = "my-app", publish = "build" means my-app/build) — so repeating the "web" prefix here
  # would double it to web/web/.next relative to the repo root, a directory that does not
  # exist. `.next` alone is what "web/.next" was reaching for.
  publish = ".next"

# Declared explicitly rather than left to auto-detection. @netlify/plugin-nextjs is still
# actively maintained (not superseded by the newer OpenNext-based adapter yet, as of this
# writing) — confirmed rather than assumed, since the package landscape here has been shifting.
# Explicit beats implicit for the same reason `base` above is checked into the repo instead of
# living only in the dashboard: it is one less thing that can be silently wrong somewhere
# neither of us can see.
[[plugins]]
  package = "@netlify/plugin-nextjs"
